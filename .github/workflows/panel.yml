# The panel reviews this repository's own pull requests, through the action in the root
# of the tree, installed from the checked-out source so a change to the action or the
# tool is what gets exercised.
name: panel
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  panel:
    # A fork's pull request has no access to this repository's secrets, so every judge
    # would report `harness`; skip rather than post an empty panel.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          install: source
